packages:
  - packages/*
  - apps/*
  - tools/*

# Shared third-party versions. Reference them from package.json as "catalog:".
catalog:
  '@eslint/js': ^10.0.1
  '@floating-ui/react': ^0.27.20
  '@tauri-apps/api': ^2.12.1
  '@tauri-apps/cli': ^2.12.1
  # Pinned: newer releases are less than two weeks old.
  '@tauri-apps/plugin-dialog': 2.8.0
  '@tauri-apps/plugin-fs': ^2.6.0
  '@testing-library/dom': ^10.4.2
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.7
  '@types/node': ^24.0.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  dependency-cruiser: ^18.5.0
  eslint: ^10.12.0
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.7
  globals: ^17.13.0
  jsdom: ^30.1.2
  prettier: ^3.9.9
  react: ^19.3.0
  react-dom: ^19.3.0
  tsx: ^4.23.15
  # Held at 6.0 until typescript-eslint supports TypeScript 7 (its peer range is <6.1).
  typescript: ~6.0.3
  typescript-eslint: ^8.71.0
  vite: ^8.3.2
  vite-plugin-singlefile: ^2.3.3
  vitest: ^5.0.3
  zod: ^4.6.5

minimumReleaseAgeExclude:
  - '@vitejs/plugin-react@6.1.2'
